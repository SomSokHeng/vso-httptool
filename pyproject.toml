[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vso-httptool"
version = "1.1.0"
description = "HTTP/1.1, HTTP/2 and HTTP/3 (QUIC) client and protocol toolkit with a hardened-by-default design"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
h3 = ["cryptography>=42"]
br = ["brotli"]
dev = ["cryptography>=42", "hpack", "pylsqpack", "hypercorn[h3]"]

[project.scripts]
httpkit = "httpkit.cli:main"

[tool.setuptools]
packages = ["httpkit"]
